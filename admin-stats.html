  function escapeVendorApplicationText(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  async function loadVendorApplications() {
    const list = document.getElementById('vendor-applications-list');
    if (!list) return;
    list.textContent = window.t('admin.vendor_applications_loading');

    const { data, error } = await supA.from('vendor_applications')
      .select('*')
      .in('status', ['pending', 'needs_info'])
      .order('created_at', { ascending: true });
    if (error) {
      list.textContent = error.code === 'PGRST205'
        ? window.t('admin.vendor_applications_setup')
        : `${window.t('admin.vendor_applications_error')} ${error.message}`;
      return;
    }
    if (!data || data.length === 0) {
      list.textContent = window.t('admin.vendor_applications_empty');
      const count = document.getElementById('vendor-application-count');
      if (count) count.textContent = '0';
      return;
    }

    const count = document.getElementById('vendor-application-count');
    if (count) count.textContent = data.length;
    list.innerHTML = data.map(application => `
      <article class="vendor-application-card">
        <h3>${escapeVendorApplicationText(application.shop_name)}</h3>
        <p><strong>${window.t('admin.vendor_applicant')}:</strong> ${escapeVendorApplicationText(application.full_name)} · ${escapeVendorApplicationText(application.email)}</p>
        <p><strong>${window.t('admin.vendor_whatsapp')}:</strong> ${escapeVendorApplicationText(application.whatsapp_number)}</p>
        <p><strong>${window.t('admin.vendor_categories')}:</strong> ${escapeVendorApplicationText(application.product_categories)}</p>
        <p><strong>${window.t('admin.vendor_proposal')}:</strong> ${escapeVendorApplicationText(application.product_description)}</p>
        <p><strong>${window.t('admin.vendor_submitted')}:</strong> ${new Date(application.created_at).toLocaleString()}</p>
        <label for="vendor-message-${application.id}">${window.t('admin.vendor_admin_message')}</label>
        <textarea id="vendor-message-${application.id}" class="vendor-application-message" placeholder="${window.t('admin.vendor_admin_message_placeholder')}">${escapeVendorApplicationText(application.admin_message || '')}</textarea>
        <div class="vendor-application-actions">
          <button type="button" class="btn-action btn-approve" onclick="reviewVendorApplication('${application.id}','approved')">${window.t('admin.vendor_approve')}</button>
          <button type="button" class="btn-action" onclick="reviewVendorApplication('${application.id}','needs_info')">${window.t('admin.vendor_request_info')}</button>
          <button type="button" class="btn-action btn-reject" onclick="reviewVendorApplication('${application.id}','rejected')">${window.t('admin.vendor_reject')}</button>
        </div>
      </article>
    `).join('');
  }

  async function reviewVendorApplication(applicationId, status) {
    const message = document.getElementById(`vendor-message-${applicationId}`)?.value.trim() || '';
    if (status !== 'approved' && !message) {
      showToast(window.t('admin.vendor_message_required'), 'error');
      return;
    }

    const { error } = await supA.rpc('review_vendor_application', {
      p_application_id: applicationId,
      p_status: status,
      p_admin_message: message || window.t('admin.vendor_default_approved_message')
    });
    if (error) {
      showToast(`${window.t('admin.vendor_review_error')} ${error.message}`, 'error');
      return;
    }

    showToast(window.t('admin.vendor_decision_saved'), 'success');
    await loadVendorApplications();
    await loadAdminData();
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 3200);
  }

  async function handleAdminLogin() {
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPass').value;
    const btn = document.getElementById('loginBtn');

    if (!email || !password) {
      showToast("❌ Antre email ak modpas", 'error');
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ Verifikasyon...";

    try {
      const { data, error } = await supA.auth.signInWithPassword({ email, password });

      if (error) {
        showToast("❌ " + error.message, 'error');
        btn.disabled = false;
        btn.innerText = "🔐 KONEKTE";
        return;
      }

      showToast("✅ Koneksyon reyisi!", 'success');
      btn.disabled = false;
      btn.innerText = "🔐 KONEKTE";

      // Verifye si se admin, epi ale nan dashboard
      await checkAccess();

    } catch (err) {
      showToast("❌ " + err.message, 'error');
      btn.disabled = false;
      btn.innerText = "🔐 KONEKTE";
    }
  }

  async function checkAccess() {
    const { data: { user } } = await supA.auth.getUser();
    if (user) {
      // ✅ VERIFYE SI SE ADMIN TOUT BON NAN TABLO PROFILES LA
      const { data: profile, error } = await supA
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (profile && profile.role === 'admin') {
        document.getElementById('admin-login-section').style.display = "none";
        document.getElementById('admin-dashboard').style.display = "block";
        loadAdminData();
      } else {
        // ❌ SI SE PA ADMIN, NOU METE L DEYÒ
        await supA.auth.signOut();
        showToast("❌ Ou pa gen pèmisyon admin!", 'error');
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('loginBtn').innerText = "🔐 KONEKTE";
      }
    }
  }

  async function loadAdminData() {
    try {
      const { data: users }  = await supA.from('profiles').select('*');
      const { data: prods }  = await supA.from('user_products').select('*');
      const { data: orders } = await supA.from('orders').select('*');
      const { data: withdrawals } = await supA.from('affiliate_withdrawals').select('*').order('created_at', { ascending: false });
      const { data: notifications } = await supA.from('admin_notifications').select('*').order('created_at', { ascending: false });
      const { data: commissions } = await supA.from('admin_commissions').select('*').order('created_at', { ascending: false });
      const { count: pendingVendorApplications } = await supA.from('vendor_applications')
        .select('id', { count: 'exact', head: true })
        .in('status', ['pending', 'needs_info']);
      const applicationCount = document.getElementById('vendor-application-count');
      if (applicationCount) applicationCount.textContent = pendingVendorApplications || 0;

      document.getElementById('stat-sellers').innerText    = users ? users.length : 0;
      document.getElementById('stat-products').innerText   = prods ? prods.length : 0;
      document.getElementById('stat-withdrawals').innerText = (withdrawals || []).filter(w => w.status === 'pending').length;
      document.getElementById('stat-revenue').innerText    = (orders || []).reduce((a, o) => a + (o.total_price || 0), 0) + " HTG";

      // Chaje notifikasyon yo
      document.getElementById('notifications-list').innerHTML = (notifications || []).map(n => `
        <tr>
          <td><span class="badge ${n.is_read ? 'pending' : 'active'}">${n.type}</span></td>
          <td>${n.title}</td>
          <td>${n.message}</td>
          <td>${new Date(n.created_at).toLocaleDateString('fr-FR')}</td>
          <td>
            ${!n.is_read ? `<button onclick="markAsRead('${n.id}')" class="btn-action btn-unblock">Mark as Read</button>` : ''}
          </td>
        </tr>
      `).join('') || '<tr><td colspan="5" style="text-align:center;padding:20px;">Pa gen notifikasyon</td></tr>';

      // Chaje komisyon yo
      document.getElementById('commissions-list').innerHTML = (commissions || []).map(c => `
        <tr>
          <td><span class="badge active">${c.referral_f}</span></td>
          <td>${c.referred_user_name || 'N/A'}</td>
          <td>${c.referred_user_email || 'N/A'}</td>
          <td><span class="badge active">${c.commission_amount} HTG</span></td>
          <td>${new Date(c.created_at).toLocaleDateString('fr-FR')}</td>
          <td><span class="badge ${c.is_paid ? 'active' : 'pending'}">${c.is_paid ? '✅ Peye' : '⏳ An atann'}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="6" style="text-align:center;padding:20px;">Pa gen komisyon</td></tr>';

      document.getElementById('sellers-list').innerHTML = (users || []).map(u => `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="seller-avatar">${(u.shop_name||u.full_name||'M').charAt(0).toUpperCase()}</div>
              <div class="seller-meta">
                <b>${u.shop_name || u.full_name || 'Boutik'}</b>
                <small>${u.email || ''}</small>
              </div>
            </div>
          </td>
          <td><span class="badge ${u.role === 'seller' ? 'active' : 'pending'}">${u.role || 'kliyan'}</span></td>
          <td><span class="badge ${u.is_active_seller ? 'active' : 'blocked'}">${u.is_active_seller ? '✅ Aktif' : '🔒 Bloke'}</span></td>
          <td style="display:flex; gap:8px; flex-wrap:wrap;">
            <button onclick="toggleSeller('${u.id}', ${u.is_active_seller})"
                    class="btn-action ${u.is_active_seller ? 'btn-block' : 'btn-unblock'}">
              ${u.is_active_seller ? '🔒 Bloke' : '🔓 Debloke'}
            </button>
            <button onclick="deleteNewShop('${u.id}')" class="btn-action btn-delete">
              🗑️ Efase
            </button>
          </td>
        </tr>`).join('');

      populateBoostSellerSelect(users);

      document.getElementById('all-products-grid').innerHTML = (prods || []).map(p => `
        <div class="prod-admin-card">
          <img class="prod-admin-img" src="${p.image_url}" alt="Pwodwi"
               onerror="this.src='https://ui-avatars.com/api/?name=P&background=f1f5f9&color=cbd5e1'">
          <div class="prod-admin-body">
            <div class="prod-admin-name">${p.title}</div>
            <div class="prod-admin-price">${p.price} HTG</div>
            <button onclick="deleteProduct('${p.id}')" class="btn-action btn-delete" style="width:100%;">🗑️ Efase</button>
          </div>
        </div>`).join('');

      document.getElementById('withdrawals-list').innerHTML = (withdrawals || []).map(w => `
        <tr>
          <td><b>${w.number || '—'}</b></td>
          <td><b>${w.amount} HTG</b></td>
          <td>${w.method || '—'}</td>
          <td><span style="font-family:'Space Mono',monospace;font-size:12px;">${w.number || '—'}</span></td>

              <button onclick="handleWithdrawal('${w.id}','approved')" class="btn-action btn-approve">✅ Apwouve</button>
              <button onclick="handleWithdrawal('${w.id}','rejected')" class="btn-action btn-reject">❌ Refize</button>

        </tr>`).join('');

      document.getElementById('orders-list').innerHTML = (orders || []).map(o => `
        <tr>
          <td><span style="font-family:'Space Mono',monospace;font-size:11px;">${o.id ? o.id.slice(0,8)+'...' : '—'}</span></td>
          <td>${o.customer_name || o.customer_phone || '—'}</td>
          <td><b>${o.total_price || o.amount || 0} HTG</b></td>
          <td><span class="badge ${o.status === 'completed' ? 'active' : o.status === 'pending' ? 'pending' : 'blocked'}">${o.status || 'pending'}</span></td>
        </tr>`).join('');

    } catch(e) { console.error(e); showToast('❌ Erè chajman done', 'error'); }
  }

  async function toggleSeller(id, status) {
    await supA.from('profiles').update({ is_active_seller: !status }).eq('id', id);
    showToast(status ? '🔒 Vendeur bloke' : '🔓 Vendeur debloke', 'success');

  async function deleteProduct(id) {
    if (!confirm("Efase pwodwi sa a definitivman?")) return;

    try {
      console.log('Cleaning up orders referencing product:', id);
      const { error: orderError } = await supA.from('orders').update({ product_id: null }).eq('product_id', id);
      if (orderError) {
        console.error('Error clearing order references:', orderError);
        throw new Error(orderError.message || 'Failed to clear order references');
      }

      console.log('Deleting product:', id);
      const { error } = await supA.from('user_products').delete().eq('id', id);
      if (error) {
        console.error('Error deleting product:', error);
        throw new Error(error.message || 'Failed to delete product');
      }

      console.log('Product deleted successfully');
      showToast('🗑️ Pwodwi efase', 'success');
      loadAdminData();
    } catch (error) {
      console.error('Delete product error:', error);
      showToast('❌ ' + error.message, 'error');
    }
  }

  async function handleWithdrawal(id, status) {
    await supA.from('affiliate_withdrawals').update({ status }).eq('id', id);
    showToast(status === 'approved' ? '✅ Retrè apwouve' : '❌ Retrè refize', 'success');

  async function markAsRead(id) {
    await supA.from('admin_notifications').update({ is_read: true }).eq('id', id);
    showToast('✅ Notifikasyon make kòm li', 'success');
    loadAdminData();

  function flattenAdminTranslations(dictionary, prefix = '', entries = []) {
    Object.entries(dictionary).forEach(([key, value]) => {
      const translationKey = prefix ? `${prefix}.${key}` : key;
      if (value && typeof value === 'object') {
        flattenAdminTranslations(value, translationKey, entries);
      } else if (typeof value === 'string') {
        entries.push([translationKey, value]);
      }
    });
    return entries;
  }

  function escapeTranslationHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  function filterAdminTranslations() {
    const query = document.getElementById('translation-search').value.trim().toLowerCase();
    document.querySelectorAll('#translation-rows tr').forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
    });
  }

  async function loadAdminTranslations() {
    const language = document.getElementById('translation-language').value;
    const status = document.getElementById('translation-status');
    const rows = document.getElementById('translation-rows');
    status.textContent = window.t('admin.translations_loading');

    try {
      const response = await fetch(`/locales/${language}.json`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const defaults = flattenAdminTranslations(await response.json());
      const { data, error } = await supA.from('site_translations')
        .select('translation_key, translation_value')
        .eq('language', language);
      const values = new Map(defaults);

      if (!error && data) data.forEach(item => values.set(item.translation_key, item.translation_value));
      rows.innerHTML = Array.from(values, ([key, value]) => `
        <tr>
          <td class="translation-key">${escapeTranslationHtml(key)}</td>
          <td><textarea class="translation-value" rows="2" data-translation-key="${escapeTranslationHtml(key)}">${escapeTranslationHtml(value)}</textarea></td>
        </tr>
      `).join('');
      rows.querySelectorAll('[data-translation-key]').forEach(input => { input.dataset.original = input.value; });
      status.textContent = error ? window.t('admin.translations_missing_table') : window.t('admin.translations_ready');
      filterAdminTranslations();
    } catch (error) {
      rows.innerHTML = '';
      status.textContent = `${window.t('admin.translations_save_error')} ${error.message}`;
    }
  }

  async function saveAdminTranslations() {
    const language = document.getElementById('translation-language').value;
    const status = document.getElementById('translation-status');
    const changes = Array.from(document.querySelectorAll('#translation-rows [data-translation-key]'))
      .filter(input => input.value !== input.dataset.original)
      .map(input => ({
        language,
        translation_key: input.dataset.translationKey,
        translation_value: input.value,
        updated_at: new Date().toISOString()
      }));

    if (!changes.length) {
      status.textContent = window.t('admin.translations_ready');
      return;
    }

    const { error } = await supA.from('site_translations')
      .upsert(changes, { onConflict: 'language,translation_key' });
    if (error) {
      status.textContent = `${window.t('admin.translations_save_error')} ${error.message}`;
      return;
    }

    document.querySelectorAll('#translation-rows [data-translation-key]').forEach(input => {
      input.dataset.original = input.value;
    });
    status.textContent = window.t('admin.translations_saved');
  }

  function showTab(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    if (event) event.currentTarget.classList.add('active');
    if(id === 'tab-new-shops') fetchNewShops();
    if(id === 'tab-traffic') fetchTrafficData();
    if(id === 'tab-translations') loadAdminTranslations();
    if(id === 'tab-vendor-applications') loadVendorApplications();
  }

  async function fetchTrafficData() {
    const tableBody = document.getElementById('traffic-list');
    try {
      const { data, error } = await supA.from('site_traffic')
        .select('date,page,visit_count,seller_id')
        .order('date', { ascending: false })
        .limit(1000);

      if (error) {
        console.warn(error);
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#64748b; padding:20px;">Trafik pa configure. Kreye tablo Supabase `site_traffic` ak kolòn `date`, `page`, `visit_count`, `seller_id`.</td></tr>';
        return;
      }

      if (!data || data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#64748b; padding:20px;">Pa gen done trafik pou kounye a.</td></tr>';
        return;
      }

      const dailyTraffic = new Map();

      data.forEach(item => {
        const dayKey = new Date(item.date).toLocaleDateString('en-CA');
        if (!dailyTraffic.has(dayKey)) {
          dailyTraffic.set(dayKey, {
            totalVisits: 0,
            pages: {}
          });
        }

        const dayStats = dailyTraffic.get(dayKey);
        const visitCount = Number(item.visit_count || 0);
        dayStats.totalVisits += visitCount;

        const page = item.page || 'Tout paj';
        dayStats.pages[page] = (dayStats.pages[page] || 0) + visitCount;
      });

      const rows = Array.from(dailyTraffic.entries())
        .sort((a, b) => b[0].localeCompare(a[0]))
        .map(([dayKey, stats]) => {
          const topPage = Object.entries(stats.pages).sort((a, b) => b[1] - a[1])[0];
          const displayDate = new Date(dayKey + 'T00:00:00').toLocaleDateString('fr-FR');

          return `
            <tr>
              <td>${displayDate}</td>
              <td>${stats.totalVisits}</td>
              <td>${topPage ? `${topPage[0]} (${topPage[1]})` : '—'}</td>
            </tr>
          `;
        })
        .join('');

      tableBody.innerHTML = rows;
    } catch (error) {
      console.error(error);
      tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#64748b; padding:20px;">Erè rechaje trafik. Gade konsole a.</td></tr>';
    }
  }

  async function saveBoostCodeToDb() {
    const codeInput = document.getElementById('boost-code-admin');
    const sellerSelect = document.getElementById('boost-seller-select');
    const code = codeInput ? codeInput.value.trim().toUpperCase() : '';
    const sellerId = sellerSelect ? sellerSelect.value : '';

    if (!code) {
      showToast('❌ Tanpri jenere yon kòd anvan ou sove li.', 'error');
      return;
    }
    if (!sellerId) {
      showToast('❌ Tanpri chwazi yon vendeur anvan ou sove kòd la.', 'error');
      return;
    }

    try {
      const { error: insertError } = await supA.from('boost_codes').insert([{
        code,
        seller_id: sellerId,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      }]);

      if (insertError) {
        console.error('Boost code insert error:', insertError);
        showToast('❌ Erè pandan sove kòd la: ' + insertError.message, 'error');
        return;
      }

      showToast('✅ Kòd boost la sove avèk siksè pou vendeur la.', 'success');
    } catch (error) {
      console.error('Save boost code exception:', error);
      showToast('❌ Erè entèvenan pandan sove kòd la.', 'error');
    }
  }

  function escapeVendorApplicationText(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  async function loadVendorApplications() {
    const list = document.getElementById('vendor-applications-list');
    if (!list) return;
    list.textContent = window.t('admin.vendor_applications_loading');

    const { data, error } = await supA.from('vendor_applications')
      .select('*')
      .in('status', ['pending', 'needs_info'])
      .order('created_at', { ascending: true });
    if (error) {
      list.textContent = error.code === 'PGRST205'
        ? window.t('admin.vendor_applications_setup')
        : `${window.t('admin.vendor_applications_error')} ${error.message}`;
      return;
    }
    if (!data || data.length === 0) {
      list.textContent = window.t('admin.vendor_applications_empty');
      const count = document.getElementById('vendor-application-count');
      if (count) count.textContent = '0';
      return;
    }

    const count = document.getElementById('vendor-application-count');
    if (count) count.textContent = data.filter(application => application.status === 'pending').length;
    list.innerHTML = data.map(application => `
      <article class="vendor-application-card">
        <h3>${escapeVendorApplicationText(application.shop_name)}</h3>
        <p><strong>${window.t('admin.vendor_applicant')}:</strong> ${escapeVendorApplicationText(application.full_name)} · ${escapeVendorApplicationText(application.email)}</p>
        <p><strong>${window.t('admin.vendor_whatsapp')}:</strong> ${escapeVendorApplicationText(application.whatsapp_number)}</p>
        <p><strong>${window.t('admin.vendor_categories')}:</strong> ${escapeVendorApplicationText(application.product_categories)}</p>
        <p><strong>${window.t('admin.vendor_proposal')}:</strong> ${escapeVendorApplicationText(application.product_description)}</p>
        <p><strong>${window.t('admin.vendor_submitted')}:</strong> ${new Date(application.created_at).toLocaleString()}</p>
        <label for="vendor-message-${application.id}" data-i18n="admin.vendor_admin_message">${window.t('admin.vendor_admin_message')}</label>
        <textarea id="vendor-message-${application.id}" class="vendor-application-message" data-i18n-placeholder="admin.vendor_admin_message_placeholder" placeholder="${window.t('admin.vendor_admin_message_placeholder')}">${escapeVendorApplicationText(application.admin_message || '')}</textarea>
        <div class="vendor-application-actions">
          <button type="button" class="btn-action btn-approve" onclick="reviewVendorApplication('${application.id}','approved')" data-i18n="admin.vendor_approve">${window.t('admin.vendor_approve')}</button>
          <button type="button" class="btn-action" onclick="reviewVendorApplication('${application.id}','needs_info')" data-i18n="admin.vendor_request_info">${window.t('admin.vendor_request_info')}</button>
          <button type="button" class="btn-action btn-reject" onclick="reviewVendorApplication('${application.id}','rejected')" data-i18n="admin.vendor_reject">${window.t('admin.vendor_reject')}</button>
        </div>
      </article>
    `).join('');
  }

  async function reviewVendorApplication(applicationId, status) {
    const message = document.getElementById(`vendor-message-${applicationId}`)?.value.trim() || '';
    if (status !== 'approved' && !message) {
      showToast(window.t('admin.vendor_message_required'), 'error');
      return;
    }

    const { error } = await supA.rpc('review_vendor_application', {
      p_application_id: applicationId,
      p_status: status,
      p_admin_message: message || window.t('admin.vendor_default_approved_message')
    });
    if (error) {
      showToast(`${window.t('admin.vendor_review_error')} ${error.message}`, 'error');
      return;
    }

    showToast(window.t('admin.vendor_decision_saved'), 'success');
    await loadVendorApplications();
    await loadAdminData();
  }

  function populateBoostSellerSelect(users) {
    const selector = document.getElementById('boost-seller-select');
    if (!selector) return;

    const sellers = (users || []).filter(u => u.role === 'seller' || u.is_active_seller === true);
    selector.innerHTML = '<option value="">Chwazi vendeur...</option>' + sellers.map(u => {
      const label = `${u.shop_name || u.full_name || u.email || u.id}`;
      return `<option value="${u.id}">${label}</option>`;
    }).join('');
  }

  async function fetchNewShops() {
    const now = new Date();

    const { data: allShops } = await supA.from('profiles')
      .select('*')
      .eq('is_active_seller', true)
      .order('created_at', { ascending: false });

    const tableBody = document.getElementById('new-shops-list');

    if (!allShops || allShops.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b; padding:20px;">Pa gen boutik.</td></tr>';
      return;
    }

    tableBody.innerHTML = allShops.map(shop => {
      const createdAt = new Date(shop.created_at);
      const timeAgo = Math.floor((now - createdAt) / (1000 * 60 * 60)); // heures

      return `
        <tr>
          <td>
            <strong>${shop.shop_name || shop.full_name || 'Enkoni'}</strong><br>
            <small style="color:#64748b;">${shop.email}</small>
          </td>
          <td>${shop.whatsapp_number || 'N/A'}</td>
          <td><small style="color:#64748b;">${timeAgo} èdtan de sa</small></td>
          <td>
            <button onclick="deleteNewShop('${shop.id}')" class="btn-action btn-delete" style="padding:6px 12px; font-size:12px;">
              🗑️ Efase
            </button>
          </td>
        </tr>
      `;
    }).join('');
  }

  async function deleteNewShop(shopId) {
    let shopName = 'ce vendeur';
    try {
      const { data: shop, error: shopFetchErr } = await supA.from('profiles').select('shop_name,full_name').eq('id', shopId).single();
      if (!shopFetchErr && shop) {
        shopName = shop.shop_name || shop.full_name || shopName;
      }
    } catch (e) {
      console.warn('Unable to fetch shop name for delete confirmation.', e);
    }
    if (!confirm(`⚠️ ATANSYON: Ou sèten ou vle efase boutik ${shopName}?\n\nSa pral:\n- Efase tout pwodwi boutik nan\n- Efase tout komande nan\n- Efase boutik nan sistèm nan\n- AKSYON SA PA KA ANNULE!`)) {
      return;
    }

    try {
      console.log('Deleting shop affiliates for shop:', shopId);
      const { error: affError } = await supA.from('affiliates').delete().eq('user_id', shopId);
      if (affError) console.warn('Warning deleting affiliates:', affError);

      console.log('Deleting shop withdrawals for shop:', shopId);
      const { error: withdrawalError } = await supA.from('affiliate_withdrawals').delete().eq('seller_id', shopId);
      if (withdrawalError) console.warn('Warning deleting withdrawals:', withdrawalError);

      console.log('Deleting shop boost codes for shop:', shopId);
      const { error: boostError } = await supA.from('boost_codes').delete().eq('seller_id', shopId);
      if (boostError) console.warn('Warning deleting boost codes:', boostError);

      console.log('Deleting shop orders for shop:', shopId);
      const { error: ordError } = await supA.from('orders').delete().eq('seller_id', shopId);
      if (ordError) console.warn('Warning deleting orders:', ordError);

      console.log('Deleting shop products for shop:', shopId);
      const { error: prodError } = await supA.from('user_products').delete().eq('seller_id', shopId);
      if (prodError) {
        console.error('Error deleting shop products:', prodError);
        throw new Error(prodError.message || 'Failed to delete shop products');
      }

      console.log('Deleting admin notifications for shop:', shopId);
      const { error: notifError } = await supA.from('admin_notifications').delete().eq('seller_id', shopId);
      if (notifError) console.warn('Warning deleting notifications:', notifError);

      console.log('Deleting shop profile for shop:', shopId);
      const { error: shopError } = await supA.from('profiles').delete().eq('id', shopId);
      if (shopError) {
        console.error('Error deleting shop profile:', shopError);
        throw new Error(shopError.message || 'Failed to delete shop profile');
      }

      console.log('Shop deleted successfully');
      showToast(`✅ Boutik ${shopName} ak tout done li yo efase!`, 'success');
      fetchNewShops();
      loadAdminData();
    } catch (error) {
      console.error('Delete shop error:', error);
      showToast('❌ ' + error.message, 'error');
    }
  }

    await supA.auth.signOut();
    showToast('✅ Ou dkonekte avèk siksè', 'success');
    document.getElementById('admin-dashboard').style.display = 'none';

  window.addEventListener('DOMContentLoaded', checkAccess);
</script>
