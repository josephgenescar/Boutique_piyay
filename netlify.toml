[build]
  command = "bundle exec jekyll build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  JEKYLL_ENV = "production"
  NODE_VERSION = "20"

[functions]
  included_files = ["ai-system-prompt.txt"]

# ✅ NETLIFY FUNCTIONS (Priyorite)
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 302

[[redirects]]
  from = "/admin/"
  to = "/admin/login.html"
  status = 302

# ❌ 404 TOUJOURS AN DERNIER
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
